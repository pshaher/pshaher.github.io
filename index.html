<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صندوق الأسئلة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ffffff; --paper2:#fcfcfa; --ink:#121212; --ink-soft:#5c5c5c;
    --accent:#121212; --accent-ink:#ffffff; --box-wood:#2a2a2a; --box-wood-dark:#000000;
    --box-shadow:rgba(0,0,0,0.18); --card-bg:#ffffff; --card-border:#bdbdbd;
    --used-bg:#ececec; --danger:#a30000; --ok:#146b14;
  }
  html,body{height:100%;}
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100%; background:var(--paper);
    font-family:"Tajawal", sans-serif; color:var(--ink);
    display:flex; flex-direction:column; align-items:center;
    padding:24px 16px 48px;
  }
  h1{font-family:"Aref Ruqaa", serif; font-size:2.8rem; margin:.2em 0 .1em; text-align:center;}
  .sub{color:var(--ink-soft); margin-bottom:1.4em; text-align:center;}
  nav{display:flex; gap:10px; margin-bottom:1.5em; flex-wrap:wrap; justify-content:center;}
  nav button{
    font-family:inherit; font-size:1rem; padding:8px 16px; border-radius:20px;
    border:1px solid var(--card-border); background:var(--card-bg); color:var(--ink);
    cursor:pointer;
  }
  nav button.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .view{width:100%; max-width:720px; display:none;}
  .view.active{display:block;}

  .paper{
    background:var(--paper2); border:1px solid var(--card-border); border-radius:3px; padding:28px;
    box-shadow:0 10px 24px var(--box-shadow);
  }
  textarea, input[type=text]{
    width:100%; font-family:"Aref Ruqaa", serif; font-size:1.4rem; color:var(--ink);
    background:transparent; border:none; border-bottom:2px dashed var(--card-border);
    resize:vertical; padding:6px 2px; outline:none;
  }
  textarea{min-height:120px;}
  .row{display:flex; align-items:center; gap:10px; margin-top:16px; flex-wrap:wrap;}
  .row label{font-size:1rem; color:var(--ink-soft); display:flex; align-items:center; gap:6px;}
  button.primary{
    margin-top:18px; font-family:"Aref Ruqaa", serif; font-size:1.4rem; font-weight:700;
    background:var(--accent); color:var(--accent-ink); border:none; border-radius:10px;
    padding:10px 28px; cursor:pointer;
  }
  button.primary:disabled{opacity:.5; cursor:default;}
  .status{margin-top:12px; min-height:1.4em; font-size:1rem;}
  .status.ok{color:var(--ok);} .status.err{color:var(--danger);}

  .miniBoxWrap{display:flex; justify-content:center; margin-top:14px;}
  #miniBox{
    font-size:1.8rem; width:48px; height:48px; display:flex; align-items:center; justify-content:center;
    border:1px dashed var(--card-border); border-radius:8px; background:var(--paper);
  }
  #miniBox.bump{animation:miniBump .35s ease;}
  @keyframes miniBump{0%{transform:scale(1);}40%{transform:scale(1.25) rotate(-4deg);}100%{transform:scale(1);}}

  #flyPaper{
    position:fixed; left:50%; top:50%; width:120px; height:150px;
    background:var(--card-bg); border:1px solid var(--card-border); border-radius:2px;
    box-shadow:0 8px 18px var(--box-shadow); pointer-events:none; z-index:50; display:none;
    background-image:repeating-linear-gradient(var(--card-border) 0 1px, transparent 1px 22px);
    background-position:10px 14px; background-size:calc(100% - 20px) calc(100% - 28px); background-repeat:no-repeat;
    transform:translate(-50%,-50%) scale(1) rotate(0deg);
  }
  @keyframes flyIntoBox{
    0%{   transform:translate(-50%,-50%) scale(1) rotate(0deg); opacity:1; }
    22%{  transform:translate(calc(-50% + var(--dx,0px)*0.12), calc(-50% + var(--dy,0px)*0.08)) scale(.82) rotate(-10deg); opacity:1; }
    45%{  transform:translate(calc(-50% + var(--dx,0px)*0.4),  calc(-50% + var(--dy,0px)*0.32)) scale(.58) rotate(12deg); opacity:1; }
    68%{  transform:translate(calc(-50% + var(--dx,0px)*0.7),  calc(-50% + var(--dy,0px)*0.68)) scale(.34) rotate(-16deg); opacity:.95; }
    88%{  transform:translate(calc(-50% + var(--dx,0px)*0.92), calc(-50% + var(--dy,0px)*0.9))  scale(.14) rotate(22deg); opacity:.7; }
    100%{ transform:translate(calc(-50% + var(--dx,0px)),      calc(-50% + var(--dy,0px)))       scale(.03) rotate(28deg); opacity:0; }
  }
  .flying{display:block !important; animation:flyIntoBox .85s cubic-bezier(.4,.1,.6,1) forwards;}

  .boxWrap{display:flex; flex-direction:column; align-items:center; gap:18px;}
  #boxSvg{width:220px; height:auto; filter:drop-shadow(0 10px 14px var(--box-shadow));}
  @keyframes shakeBox{
    0%,100%{transform:translate(0,0) rotate(0deg);} 10%{transform:translate(-6px,0) rotate(-4deg);}
    20%{transform:translate(6px,0) rotate(4deg);} 30%{transform:translate(-8px,-2px) rotate(-5deg);}
    40%{transform:translate(8px,-2px) rotate(5deg);} 50%{transform:translate(-6px,0) rotate(-3deg);}
    60%{transform:translate(6px,0) rotate(3deg);} 70%{transform:translate(-4px,0) rotate(-2deg);}
    80%{transform:translate(4px,0) rotate(2deg);} 90%{transform:translate(-2px,0) rotate(-1deg);}
  }
  .shaking{animation:shakeBox .18s linear 9;}
  button.shakeBtn{
    font-family:"Aref Ruqaa", serif; font-size:1.6rem; font-weight:700;
    background:var(--box-wood); color:#fff; border:none; border-radius:10px;
    padding:12px 30px; cursor:pointer; box-shadow:0 4px 0 var(--box-wood-dark);
  }
  button.shakeBtn:active{transform:translateY(3px); box-shadow:none;}
  button.shakeBtn:disabled{opacity:.5; cursor:default; box-shadow:none;}

  @keyframes revealCard{0%{transform:scale(.7) rotateX(60deg); opacity:0;}100%{transform:scale(1) rotateX(0deg); opacity:1;}}
  .revealWrap{perspective:800px; width:100%;}
  .questionCard{
    margin-top:10px; background:var(--card-bg); border:1px solid var(--card-border);
    border-radius:10px; padding:22px; font-family:"Aref Ruqaa", serif; font-size:1.7rem;
    animation:revealCard .5s ease-out; box-shadow:0 6px 16px var(--box-shadow);
  }
  .questionCard .who{font-family:"Tajawal",sans-serif; font-size:.95rem; color:var(--ink-soft); margin-top:10px;}
  .emptyBox{color:var(--ink-soft); font-style:italic; margin-top:10px;}

  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:14px; margin-top:10px;}
  .gcard{
    background:var(--card-bg); border:1px solid var(--card-border); border-radius:8px;
    padding:14px; font-family:"Aref Ruqaa", serif; font-size:1.3rem; position:relative;
    min-height:100px; display:flex; flex-direction:column; justify-content:space-between;
  }
  .gcard.used{background:var(--used-bg); opacity:.75;}
  .badge{position:absolute; top:8px; left:10px; font-family:"Tajawal",sans-serif; font-size:.7rem; padding:2px 8px; border-radius:10px; background:var(--ok); color:#fff;}
  .gcard.used .badge{background:var(--ink-soft);}
  .gwho{font-family:"Tajawal",sans-serif; font-size:.85rem; color:var(--ink-soft); margin-top:8px;}
  .lockmsg{text-align:center; color:var(--ink-soft); margin:10px 0;}
  .loginBox{max-width:360px; margin:0 auto; text-align:center;}
  .logoutRow{text-align:left; margin-bottom:10px;}
  .logoutRow button{background:none; border:1px solid var(--card-border); border-radius:16px; padding:5px 14px; font-family:"Tajawal",sans-serif; cursor:pointer; color:var(--ink);}
</style>
</head>
<body>

<h1>📦 صندوق الأسئلة</h1>
<div class="sub" id="tagline">ضع سؤالك في الصندوق — باسمك أو بدون اسم.</div>

<nav>
  <button id="navSubmit" class="active">✍️ اطرح سؤالاً</button>
  <button id="navAdmin">🗳️ الصندوق</button>
</nav>

<div class="view active" id="view-submit">
  <div class="paper">
    <textarea id="qText" placeholder="اكتب سؤالك هنا..." maxlength="600"></textarea>
    <div class="row">
      <input type="text" id="qName" placeholder="اسمك" maxlength="60">
      <label><input type="checkbox" id="qAnon"> إرسال بدون اسم (مجهول)</label>
    </div>
    <button class="primary" id="submitBtn">ضعه في الصندوق</button>
    <div class="status" id="submitStatus"></div>
    <div class="miniBoxWrap"><div id="miniBox">📦</div></div>
  </div>
</div>

<div class="view" id="view-admin">
  <div id="loginBox" class="paper loginBox">
    <button class="primary" id="loginBtn">تسجيل الدخول عبر Google</button>
    <div class="status" id="loginStatus"></div>
  </div>
  <div id="adminContent" style="display:none;">
    <div class="logoutRow"><button id="logoutBtn">تسجيل الخروج</button></div>
    <nav style="margin-bottom:1em;">
      <button id="tabDraw" class="active">🎲 اسحب سؤالاً</button>
      <button id="tabGrid">🔳 كل الأسئلة</button>
    </nav>
    <div id="tab-draw" class="boxWrap">
      <svg id="boxSvg" viewBox="0 0 220 180" xmlns="http://www.w3.org/2000/svg">
        <rect x="20" y="70" width="180" height="100" rx="6" fill="var(--box-wood)"/>
        <rect x="20" y="70" width="180" height="100" rx="6" fill="none" stroke="var(--box-wood-dark)" stroke-width="4"/>
        <polygon points="10,70 110,30 210,70" fill="var(--box-wood-dark)"/>
        <rect x="95" y="70" width="30" height="55" fill="#1a120a" rx="3"/>
        <line x1="20" y1="115" x2="200" y2="115" stroke="var(--box-wood-dark)" stroke-width="3"/>
      </svg>
      <button class="shakeBtn" id="shakeBtn">هزّ الصندوق!</button>
      <div class="revealWrap"><div id="revealArea"></div></div>
    </div>
    <div id="tab-grid" class="grid" style="display:none;"></div>
  </div>
</div>

<div id="flyPaper"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, doc, updateDoc,
  query, orderBy, onSnapshot
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

// ====== PASTE YOUR FIREBASE CONFIG HERE ======
  const firebaseConfig = {
    apiKey: "AIzaSyAdcp0fjFmmPar0JUtVfLaS4H7gi0KAULU",
    authDomain: "churchshabab.firebaseapp.com",
    projectId: "churchshabab",
    storageBucket: "churchshabab.firebasestorage.app",
    messagingSenderId: "937198728491",
    appId: "1:937198728491:web:185dbed782b4de0800816e"
  };
// ==============================================



const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let allQuestions = [];
let unsubSnapshot = null;

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function $(id){ return document.getElementById(id); }

function showView(view){
  $("view-submit").classList.toggle("active", view==="submit");
  $("view-admin").classList.toggle("active", view==="admin");
  $("navSubmit").classList.toggle("active", view==="submit");
  $("navAdmin").classList.toggle("active", view==="admin");
  $("tagline").textContent = view==="admin"
    ? "هزّ الصندوق لسحب سؤال، أو تصفح كل الأسئلة التي وصلت."
    : "ضع سؤالك في الصندوق — باسمك أو بدون اسم.";
}
$("navSubmit").addEventListener("click", ()=>showView("submit"));
$("navAdmin").addEventListener("click", ()=>showView("admin"));

$("submitBtn").addEventListener("click", async ()=>{
  const textEl = $("qText"), nameEl = $("qName"), anonEl = $("qAnon");
  const statusEl = $("submitStatus"), btn = $("submitBtn"), miniBox = $("miniBox");
  const text = textEl.value.trim();
  if(!text){ statusEl.textContent = "اكتب سؤالاً أولاً!"; statusEl.className = "status err"; return; }
  btn.disabled = true; statusEl.textContent = ""; statusEl.className = "status";

  const fly = $("flyPaper");
  const startRect = textEl.getBoundingClientRect();
  const endRect = miniBox.getBoundingClientRect();
  const sx = startRect.left+startRect.width/2, sy = startRect.top+startRect.height/2;
  const ex = endRect.left+endRect.width/2, ey = endRect.top+endRect.height/2;
  fly.classList.remove("flying");
  fly.style.left = sx+"px"; fly.style.top = sy+"px";
  fly.style.setProperty("--dx",(ex-sx)+"px"); fly.style.setProperty("--dy",(ey-sy)+"px");
  void fly.offsetWidth; fly.classList.add("flying");
  fly.addEventListener("animationend", function onEnd(){
    fly.removeEventListener("animationend", onEnd);
    miniBox.classList.remove("bump"); void miniBox.offsetWidth; miniBox.classList.add("bump");
  }, {once:true});

  try{
    await addDoc(collection(db,"questions"), {
      text: text,
      name: anonEl.checked ? null : (nameEl.value.trim() || null),
      isAnonymous: anonEl.checked,
      createdAt: Date.now(),
      used: false
    });
    setTimeout(()=>{
      statusEl.textContent = "تم وضع سؤالك في الصندوق! 📦";
      statusEl.className = "status ok";
      textEl.value=""; nameEl.value=""; anonEl.checked=false;
      btn.disabled = false;
    }, 700);
  }catch(e){
    statusEl.textContent = "حدث خطأ أثناء الإرسال — حاول مرة أخرى.";
    statusEl.className = "status err";
    btn.disabled = false;
  }
});

$("loginBtn").addEventListener("click", async ()=>{
  const statusEl = $("loginStatus");
  statusEl.textContent = ""; statusEl.className = "status";
  try{
    await signInWithPopup(auth, new GoogleAuthProvider());
  }catch(e){
    statusEl.textContent = "تعذّر تسجيل الدخول.";
    statusEl.className = "status err";
  }
});
$("logoutBtn").addEventListener("click", ()=> signOut(auth));

onAuthStateChanged(auth, (user)=>{
  const statusEl = $("loginStatus");
  if(user && user.email === ADMIN_EMAIL){
    statusEl.textContent = "";
    $("loginBox").style.display = "none";
    $("adminContent").style.display = "block";
    if(!unsubSnapshot) subscribeQuestions();
  }else{
    if(user){
      statusEl.textContent = "هذا الحساب غير مخوّل بالدخول.";
      statusEl.className = "status err";
      signOut(auth);
    }
    $("loginBox").style.display = "block";
    $("adminContent").style.display = "none";
  }
});

function subscribeQuestions(){
  const q = query(collection(db,"questions"), orderBy("createdAt","desc"));
  unsubSnapshot = onSnapshot(q, snap=>{
    allQuestions = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    renderGrid();
  });
}

$("tabDraw").addEventListener("click", ()=>showAdminTab("draw"));
$("tabGrid").addEventListener("click", ()=>showAdminTab("grid"));
function showAdminTab(tab){
  $("tabDraw").classList.toggle("active", tab==="draw");
  $("tabGrid").classList.toggle("active", tab==="grid");
  $("tab-draw").style.display = tab==="draw" ? "flex" : "none";
  $("tab-grid").style.display = tab==="grid" ? "grid" : "none";
}

$("shakeBtn").addEventListener("click", async ()=>{
  const btn = $("shakeBtn"), svg = $("boxSvg"), reveal = $("revealArea");
  btn.disabled = true; reveal.innerHTML = "";
  svg.classList.remove("shaking"); void svg.offsetWidth; svg.classList.add("shaking");
  await new Promise(r=>setTimeout(r,1700));
  svg.classList.remove("shaking");

  const unused = allQuestions.filter(q => !q.used);
  if(unused.length === 0){
    reveal.innerHTML = '<div class="emptyBox">الصندوق فارغ — لا مزيد من الأسئلة لسحبها!</div>';
    btn.disabled = false; return;
  }
  const pick = unused[Math.floor(Math.random()*unused.length)];
  const who = pick.isAnonymous || !pick.name ? "مجهول" : esc(pick.name);
  reveal.innerHTML = '<div class="questionCard">«'+esc(pick.text)+'»<div class="who">— '+who+'</div></div>';
  try{ await updateDoc(doc(db,"questions",pick.id), {used:true}); }catch(e){}
  btn.disabled = false;
});

function renderGrid(){
  const grid = $("tab-grid");
  if(allQuestions.length === 0){ grid.innerHTML = '<div class="emptyBox">لا توجد أسئلة بعد.</div>'; return; }
  grid.innerHTML = allQuestions.map(q=>{
    const who = q.isAnonymous || !q.name ? "مجهول" : esc(q.name);
    const d = q.createdAt ? new Date(q.createdAt).toLocaleString('ar') : "";
    return '<div class="gcard '+(q.used?'used':'')+'">'
      + '<span class="badge">'+(q.used?'تم سحبه':'في الصندوق')+'</span>'
      + '<div>«'+esc(q.text)+'»</div>'
      + '<div class="gwho">— '+who+' · '+esc(d)+'</div></div>';
  }).join("");
}
</script>
</body>
</html>
